name: CD - Deploy to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create backend .env from GitHub Secrets
        run: |
          echo "APP_SECRET_NAME=${{ secrets.APP_SECRET_NAME }}" > ./backend/.env

      - name: Allow .env in backend Docker build
        run: sed -i '/.env/d' ./backend/.dockerignore

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-testing-deploy:backend ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-testing-deploy:backend

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-testing-deploy:frontend ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-testing-deploy:frontend
